<mat-sidenav-container class="side-nav">
  <mat-sidenav
    #sidenav
    mode="push"
    (opened)="onSideNavOpen($event)"
    (closed)="onSideNavClose($event)"
    [opened]="sideMenuOpen"
  >
    <mat-list>
      @for (link of headerLinks; track link) {
      <mat-list-item (click)="onNavigateDown(link.targetElement)">{{
        link.title
      }}</mat-list-item>
      <mat-divider></mat-divider>
      }
    </mat-list>
  </mat-sidenav>
  <mat-sidenav-content class="no-scroll-x">
    <nav-bar
      class="dark"
      (navBarClicked)="sidenav.toggle()"
      (navBarLinkClicked)="onNavigateDown($event)"
    ></nav-bar>
    <home-page
      id="home"
      class="dark"
      (navigateToggle)="onNavigateDown($event)"
    ></home-page>
    <about-me id="about" class="about parent--container" #about></about-me>
    <div class="wave--spacer wave--bottom--alt--layer xs dark--grey"></div>
    <experience
      id="experience"
      class="skillset parent--container"
      #experience
    ></experience>
    <div class="wave--spacer wave--bottom--alt--layer xs dark--grey"></div>
    <projects
      id="projects"
      class="projects parent--container"
      #projects
    ></projects>
    <div class="wave--spacer wave--bottom--alt--layer xs dark--grey"></div>
    <contact id="contact" class="contact parent--container" #contact></contact>
    <div class="wave--spacer wave--bottom--layer xs transparent"></div>
  <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
