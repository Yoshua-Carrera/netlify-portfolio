<div class="full-height-container dark--grey" *ngIf="{ applicationToggles: applicationToggles$ | async } as variables">
  <header class="mat-headline-2 watch--underline pink--accent">
    {{ experienceCopy.header }}
  </header>
  <div class="timeline-container {{ variables.applicationToggles.timelineRedesign ? timelimeVersions.REDESIGN : timelimeVersions.LEGACY }}">
    @if (!variables.applicationToggles.timelineRedesign) {
      <mat-grid-list cols="21" [rowHeight]="rowHeight">
        @for (tile of tiles; track tile) {
        <mat-grid-tile [colspan]="tile.cols" [rowspan]="tile.rows" [style.background]="tile.color" [ngClass]="tile.className">
          <grid-timeline [tile]="tile" [experienceCopy]="experienceCopy"></grid-timeline>
        </mat-grid-tile>
        }
      </mat-grid-list>  
    } @else {
      @for (tile of tiles; track tile) {
      <timeline-redesigned [tile]="tile" [experienceCopy]="experienceCopy"></timeline-redesigned>
      <br *ngIf="tile.company">
      }
    }
  </div>
</div>
