 <div
  class="main"
  *ngIf="{ applicationToggles: applicationToggles$ | async } as variables"
>
  <netlify-form *ngIf="needsToLogin && variables.applicationToggles.loginEnabled"></netlify-form>
  <mat-sidenav-container class="side-nav" *ngIf="!needsToLogin || !variables.applicationToggles.loginEnabled">
    <mat-sidenav
      #sidenav
      mode="push"
      (opened)="onSideNavOpen($event)"
      (closed)="onSideNavClose($event)"
      [opened]="sideMenuOpen"
    >
      <mat-list>
        @for (link of headerLinks; track link) {
        <mat-list-item (click)="onNavigateDown(link.targetElement)">{{
          link.title
        }}</mat-list-item>
        <mat-divider></mat-divider>
        }
      </mat-list>
    </mat-sidenav>
    <mat-sidenav-content class="no-scroll-x">
      <nav-bar
        class="dark"
        (navBarClicked)="sidenav.toggle()"
        (navBarLinkClicked)="onNavigateDown($event)"
      ></nav-bar>
    <router-outlet></router-outlet>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
